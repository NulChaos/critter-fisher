name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > keystore.p12
      - name: Build
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk CritterFisher-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CritterFisher-${{ github.run_number }}
          path: CritterFisher-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: CritterFisher-${{ github.run_number }}.apk
          make_latest: true
