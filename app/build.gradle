plugins { id 'com.android.application' }

android {
    namespace 'com.nul.critterfisher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nul.critterfisher'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
        versionName "1." + versionCode
    }
    signingConfigs {
        release {
            storeFile rootProject.file('keystore.jks')
            storePassword 'critter'
            keyAlias 'critter'
            keyPassword 'critter'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
